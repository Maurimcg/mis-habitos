name: mis_habitos
description: "Mis hábitos: seguimiento de hábitos semanales con PIN y base de datos SQLite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  # Base de datos: SQLite + drift (ORM tipado y reactivo).
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  # Hash del PIN (PBKDF2-HMAC-SHA256).
  crypto: ^3.0.8
  # Fechas en español.
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Genera el código de la base de datos (lib/data/database.g.dart).
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
