name: APK de Android

# Compila un APK instalable en cada push a main (queda como artefacto) y,
# al crear una etiqueta v*, lo publica en la sección Releases del repositorio.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar
        run: cp build/app/outputs/flutter-apk/app-release.apk mis-habitos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mis-habitos-apk
          path: mis-habitos.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Mis hábitos ${{ github.ref_name }}
          body: |
            APK para Android. Descárgalo desde el celular y ábrelo para instalarlo
            (Android pedirá permitir "instalar apps desconocidas" para el navegador).
          files: mis-habitos.apk
